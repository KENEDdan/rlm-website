# Production stack (CLAUDE.md rule 10). Only Caddy publishes ports. Postgres and Redis live on an internal
# network with no internet access and no published ports. App containers run read-only as a non-root
# user with all Linux capabilities dropped.
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm backup        # also run nightly from cron
#
# See docs/DEPLOYMENT.md. Secrets live only in .env on the server (chmod 600), never in this file.
name: rlm-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging: *logging

x-app: &app
  <<: *hardening
  image: ${RLM_IMAGE:-rlm-web:prod}
  env_file: ${RLM_ENV_FILE:-.env}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    # Only Caddy (fixed address below) may set X-Forwarded-* headers for gunicorn.
    GUNICORN_FORWARDED_ALLOW_IPS: 172.30.10.10
  tmpfs: ["/tmp:size=64m", "/dev/shm:size=64m"]
  volumes:
    - media:/app/data/media
    # Private uploads (receipts, permits, member documents). Caddy never mounts this volume: files are only
    # reachable through the permission-checked, audit-logged staff-portal download view.
    - private:/app/data/private
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    media-init: { condition: service_completed_successfully }

services:
  # One-shot: make the media and private volumes writable by the app user (uid 10001). A new named volume otherwise
  # takes the ownership of whichever image mounts it first (e.g. root-owned /media in Alpine images).
  media-init:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    # Idempotent: only acts on a new (root-owned) volume. chmod comes before chown, because root without
    # CAP_FOWNER cannot change the mode of a directory it no longer owns.
    command: ["sh", "-c", "for d in /media /private; do test $$(stat -c %u $$d) = 10001 || { chmod 750 $$d && chown 10001:10001 $$d; }; done"]
    volumes:
      - media:/media
      - private:/private
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    restart: "no"
    logging: *logging

  caddy:
    <<: *hardening
    image: caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    cap_add: [NET_BIND_SERVICE]
    # Read uploads through the app group (files are 0640 app:app); no capability can bypass that.
    group_add: ["10001"]
    env_file: ${RLM_ENV_FILE:-.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/media:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp"]
    depends_on:
      web: { condition: service_healthy }
    networks:
      front:
        ipv4_address: 172.30.10.10
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  web:
    <<: *app
    build:
      context: .
      target: prod
    networks: [front, data]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M }
    # HEALTHCHECK comes from the image (docker/healthcheck.py).

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=WARNING", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks: [front, data]  # front: outbound SMTP / Turnstile / Sentry
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    networks: [data]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

  # One-off: docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    healthcheck:
      disable: true
    networks: [data]
    profiles: ["tools"]

  # One-off / cron: docker compose -f docker-compose.prod.yml run --rm backup
  backup:
    <<: *hardening
    restart: "no"
    build: ./docker/backup
    image: rlm-backup:prod
    env_file: ${RLM_ENV_FILE:-.env}
    volumes:
      - media:/media
      - private:/private
      - ${BACKUP_DIR:-./backups}:/backups
      - ./docker/rclone:/config/rclone:ro
    tmpfs: ["/tmp"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data, front]  # front: optional off-site copy with rclone
    profiles: ["tools"]

  db:
    <<: *hardening
    image: postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rlm}
      POSTGRES_USER: ${POSTGRES_USER:-rlm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs: ["/tmp", "/var/run/postgresql"]
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  # Optional virus scan of every upload (CLAMAV_ENABLED=true in .env, then
  # `docker compose --profile clamav up -d`). Only on the private data network; downloads signatures daily.
  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["clamav"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [data, egress]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1536M }

  redis:
    <<: *hardening
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    # Cache + task queue only: no persistence, password required, only reachable on the data network.
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [data]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

volumes:
  pgdata:
  media:
  private:
  caddy_data:
  caddy_config:

networks:
  front:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  data:
    internal: true  # no route to the internet; not reachable from outside the host
  egress: {}  # ClamAV signature downloads only (nothing else joins it)
