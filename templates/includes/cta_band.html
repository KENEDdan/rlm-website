{% load rlm %}<section class="bg-rlm-black text-rlm-white">
  <div class="flame-bar"></div>
  <div class="container-rlm grid items-center gap-8 py-14 md:grid-cols-3">
    <div class="md:col-span-2">
      {% page_text "cta_band" as t %}<h2 class="font-display text-3xl font-extrabold">{{ t.heading }}</h2>
      {% if t.intro %}<p class="mt-3 text-rlm-line">{{ t.intro }}</p>{% endif %}
    </div>
    <div class="flex flex-wrap gap-3 md:justify-end">
      <a href="{% url 'giving:give' %}" class="btn-primary">Give</a>
      <a href="{% url 'registrations:volunteer' %}" class="btn-outline-light">Volunteer</a>
      <a href="{% url 'events:list' %}" class="btn-outline-light">Events</a>
    </div>
  </div>
</section>
