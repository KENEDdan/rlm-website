{% if page_obj.has_other_pages %}
<nav class="mt-10 flex items-center justify-center gap-2 text-sm font-semibold" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="btn-outline btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}" rel="prev">Previous</a>{% endif %}
  <span class="px-3 text-rlm-grey">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn-outline btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.next_page_number }}" rel="next">Next</a>{% endif %}
</nav>
{% endif %}
