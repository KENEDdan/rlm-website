{% load rlm %}<article class="card p-6">
  <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-flame text-rlm-black">{% icon activity.icon "h-6 w-6" %}</div>
  <h3 class="mt-5 text-lg font-bold"><a href="{{ activity.get_absolute_url }}" class="hover:text-rlm-flame-dark">{{ activity.title }}</a></h3>
  <p class="mt-2 text-sm text-rlm-grey">{{ activity.summary }}</p>
  {% if activity.schedule %}<p class="mt-3 text-xs font-semibold uppercase tracking-wide text-rlm-grey">{{ activity.schedule }}</p>{% endif %}
  <a href="{{ activity.get_absolute_url }}" class="mt-auto inline-flex items-center gap-1 pt-4 text-sm font-semibold text-rlm-flame-dark hover:underline">Learn more {% icon "arrow" "h-4 w-4" %}<span class="sr-only"> about {{ activity.title }}</span></a>
</article>
