{% extends "staff_base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1 class="text-xl font-display font-bold mb-4">Sign in</h1>
<form method="post" novalidate class="staff-form">
  {% csrf_token %}
  {% include "accounts/_form.html" %}
  <button type="submit" class="btn-primary w-full">Continue</button>
</form>
<p class="mt-4 text-xs text-rlm-grey">Two-factor authentication is required for every staff account.</p>
{% endblock %}
